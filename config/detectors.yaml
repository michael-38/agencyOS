  - { name: Gravity Forms, patterns: ["gform_wrapper", "gravityforms"] }
  - { name: WPForms, patterns: ["wpforms"] }
  - { name: Contact Form 7, patterns: ["wpcf7"] }
  - { name: Ninja Forms, patterns: ["nf-form-cont", "ninja-forms"] }
