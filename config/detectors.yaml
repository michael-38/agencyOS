  - { name: Squarespace forms, patterns: ["sqs-block-form", "form-block"] }

# Regexes (JavaScript syntax, case-insensitive flag applied by the loader).
hours_regex: "\\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\\.?\\s*(-|–|to|through)?\\s*(mon|tue|wed|thu|fri|sat|sun)?[a-z]*\\.?\\s*:?\\s*\\d{1,2}(:\\d{2})?\\s*(am|pm|a\\.m\\.|p\\.m\\.)"
address_regex: "\\b\\d{1,6}\\s+[A-Za-z0-9.'\\- ]{2,40}\\s+(St|Street|Ave|Avenue|Rd|Road|Blvd|Boulevard|Dr|Drive|Ln|Lane|Way|Ct|Court|Hwy|Highway|Pkwy|Parkway|Pl|Place|Ter|Terrace|Cir|Circle)\\b\\.?"
phone_regex: "(\\+?1[\\s.-]?)?\\(?\\d{3}\\)?[\\s.-]?\\d{3}[\\s.-]?\\d{4}"
