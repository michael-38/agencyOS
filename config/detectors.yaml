# Vendor / schema detection data used by website-audit's deterministic checks.
# All pattern matching is case-insensitive substring matching against the raw HTML
# (script src, iframe src, link href, class names, data attributes) unless noted.
# No vendor or industry name may be hard-coded in website-audit/src — add it here.
# An industry entry in industries.yaml may carry a `detectors:` block of the same shape;
# it is merged over these lists for that run.
version: 1

# schema.org @type values accepted by the `jsonld-localbusiness` check in addition to the
# archetype's own jsonld_type. Keep this a superset across industries.
schema_org_local_business_subtypes:
  - LocalBusiness
  - ProfessionalService
  - HomeAndConstructionBusiness
  - Plumber
  - Electrician
  - HVACBusiness
  - RoofingContractor
  - GeneralContractor
  - HousePainter
  - Locksmith
  - MovingCompany
  - MedicalBusiness
  - MedicalClinic
  - Physician
  - Dentist
  - HealthAndBeautyBusiness
  - BeautySalon
  - DaySpa
  - HairSalon
  - LegalService
  - Attorney
  - AccountingService
  - FinancialService
  - RealEstateAgent
  - AutoRepair
  - AutoDealer
  - Store
  - Restaurant
  - LodgingBusiness
  - SportsActivityLocation
  - ExerciseGym
  - PetStore
  - VeterinaryCare
  - ChildCare
  - EducationalOrganization
  - Organization

booking_widgets:
  - { name: Calendly, patterns: ["calendly.com"] }
  - { name: Acuity Scheduling, patterns: ["acuityscheduling.com", "squarespacescheduling.com"] }
  - { name: Housecall Pro, patterns: ["housecallpro.com", "book.housecallpro"] }
  - { name: Jobber, patterns: ["clienthub.getjobber.com", "getjobber.com"] }
  - { name: ServiceTitan, patterns: ["servicetitan.com", "st-scheduler"] }
  - { name: Square Appointments, patterns: ["squareup.com/appointments", "square.site"] }
  - { name: Vagaro, patterns: ["vagaro.com"] }
  - { name: Booksy, patterns: ["booksy.com"] }
  - { name: Mindbody, patterns: ["mindbodyonline.com", "healcode"] }
  - { name: Zenoti, patterns: ["zenoti.com"] }
  - { name: Setmore, patterns: ["setmore.com"] }
  - { name: SimplyBook, patterns: ["simplybook.me"] }
  - { name: Zocdoc, patterns: ["zocdoc.com"] }
  - { name: Cal.com, patterns: ["cal.com/"] }
  - { name: Schedulicity, patterns: ["schedulicity.com"] }
  - { name: Boulevard, patterns: ["blvd.co", "joinblvd"] }
  - { name: Aesthetic Record, patterns: ["aestheticrecord.com"] }
  - { name: Workiz, patterns: ["workiz.com"] }
  - { name: FieldPulse, patterns: ["fieldpulse.com"] }
  - { name: LawnPro, patterns: ["lawnprosoftware.com"] }
  - { name: Yardbook, patterns: ["yardbook.com"] }

# Words that, when they appear in a link/button label, mark it as a booking CTA
# (matched case-insensitively as whole words or phrases).
booking_cta_words:
  - book
  - book now
  - book online
  - schedule
  - schedule now
  - appointment
  - reserve
  - request service
  - request an estimate
  - request a quote
  - get a quote
  - free estimate
  - free quote

