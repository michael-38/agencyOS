    persona_file: personas/med-spa.md
    template_file: templates/personas/med-spa/index.html
    build_reference_file: templates/personas/med-spa/reference.md

  - slug: senior-care
    display_name: Senior care & assisted living
    aliases: [assisted living, memory care, senior living, retirement community, independent living, respite care, home care for seniors, nursing home]
