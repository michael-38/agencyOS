# Single source of truth for industries. Read by website-audit (classifier, persona loader,
# deterministic checks) and by the build-industry-site skill (v2). Adding an industry = add an
# entry here + a persona file + a template. Adding an archetype = add an entry here + a reference file.
version: 1

archetypes:
  - id: local-service
    jsonld_type: LocalBusiness
    reference_file: templates/archetypes/local-service.md
  - id: professional-services
    jsonld_type: ProfessionalService
    reference_file: templates/archetypes/professional-services.md
  - id: generic
    jsonld_type: Organization
    reference_file: templates/archetypes/generic.md

industries:
  - slug: landscaping
    display_name: Landscaping & lawn care
    aliases: [landscaper, landscape design, lawn care, lawn maintenance, hardscaping, yard maintenance, irrigation, tree service]
    archetype: local-service
    persona_file: personas/landscaping.md
    template_file: templates/personas/landscaping/index.html
    build_reference_file: templates/personas/landscaping/reference.md

  - slug: cleaning
    display_name: Cleaning services
    aliases: [house cleaning, maid service, housekeeping, residential cleaning, commercial cleaning, janitorial, deep cleaning, move-out cleaning]
    archetype: local-service
    persona_file: personas/cleaning.md
    template_file: templates/personas/cleaning/index.html
    build_reference_file: templates/personas/cleaning/reference.md

  - slug: med-spa
    display_name: Med spa & aesthetics
    aliases: [medical spa, medspa, aesthetics, aesthetician, injectables, botox, fillers, laser treatments, skin clinic, cosmetic treatments, body contouring]
