    build_reference_file: templates/personas/senior-care/reference.md

  - slug: wedding-venues
    display_name: Wedding & event venues
    aliases: [wedding venue, event venue, banquet hall, barn wedding, estate weddings, reception venue, wedding packages, rehearsal dinner]
    archetype: local-service
    persona_file: personas/wedding-venues.md
    template_file: templates/personas/wedding-venues/index.html
    build_reference_file: templates/personas/wedding-venues/reference.md

  - slug: schools-camps
    display_name: Private schools & camps
    aliases: [private school, independent school, preschool, montessori, academy, summer camp, day camp, sleepaway camp, admissions, enrollment, tuition]
